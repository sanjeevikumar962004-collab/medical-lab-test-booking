<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Create Account | Stackly Diagnostics Salem</title>
<meta name="description" content="Register with Stackly Diagnostics Salem to track health packages, access digital blood test reports, and schedule home sample visits.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">

<header class="auth-header">
 <a href="index.html" class="logo" aria-label="Stackly home"><img src="images/stackly logo.webp" alt="Stackly" class="stackly-logo-img"></a>
 <a href="index.html" class="btn ghost" style="padding:8px 18px;font-size:13.5px">&larr; Back to Home</a>
</header>

<main class="auth-container">
 <div class="auth-box">
  <div class="auth-head">
   <span class="badge" style="margin-bottom:8px"><b>Register</b>New Patient Portal</span>
   <h1>Create Your Account</h1>
   <p>Register to manage lab test bookings and download verified PDF reports anytime.</p>
  </div>

  <form id="signupForm" class="auth-form" novalidate>
   <div class="fg">
    <label for="signupName">Full Name *</label>
    <input type="text" id="signupName" required placeholder="e.g. Ramesh Kumar" autocomplete="name">
   </div>

   <div class="fg">
    <label for="signupEmail">Email Address *</label>
    <input type="email" id="signupEmail" required placeholder="yourname@gmail.com" autocomplete="email">
   </div>

   <div class="fg">
    <label for="signupRole">Account Type *</label>
    <select id="signupRole" required>
     <option value="user" selected>Patient / Customer</option>
     <option value="admin">Lab Staff / Administrator</option>
    </select>
   </div>

   <div class="fg">
    <label for="signupPassword">Create Password *</label>
    <input type="password" id="signupPassword" required placeholder="Min 8 chars (letters, number & symbol)" autocomplete="new-password">
   </div>

   <div class="fg">
    <label for="signupConfirmPassword">Confirm Password *</label>
    <input type="password" id="signupConfirmPassword" required placeholder="Repeat your password" autocomplete="new-password">
   </div>

   <div class="fg" style="flex-direction:row;align-items:flex-start;gap:10px;margin-top:4px">
    <input type="checkbox" id="signupAgree" required style="width:18px;height:18px;margin-top:2px;accent-color:var(--green)">
    <label for="signupAgree" style="font-size:13px;font-weight:400;color:var(--muted);line-height:1.4">
     I agree to Stackly Diagnostics <a href="404.html" style="color:var(--green);font-weight:600">Terms of Service</a> and <a href="404.html" style="color:var(--green);font-weight:600">Privacy Policy</a>.
    </label>
   </div>

   <button type="submit" class="btn green" style="width:100%;padding:14px;border-radius:14px;font-size:15px;margin-top:8px">Create Account</button>
  </form>

  <div class="auth-footer-text">
   Already have an account? <a href="login.html">Sign in here</a>
  </div>
 </div>
</main>

<script src="validation.js"></script>
</body>
</html>
